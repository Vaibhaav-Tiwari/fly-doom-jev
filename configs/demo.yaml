# Demo configuration — full MaleCNS v1.0 connectome, real ViZDoom, live Jev.
seed: 42
controller: jev               # jev (Jev+MaleCNS, default) | brain (MaleCNS ALONE:
                              # Jev bypassed, zero API calls, pure neural decoder).
                              # Live server: POST /new {"controller": "brain"}
                              # switches per episode; recordings are tagged.

environment:
  backend: vizdoom            # vizdoom | fixture (fixture = deterministic test env, clearly labeled)
  scenario: fly_arena         # fly_arena (default; custom, see below) | e1m1
                              # (FreeDoom E1M1, bundled w/ ViZDoom, BSD-3) |
                              # basic | defend_the_center | defend_the_line |
                              # deadly_corridor. Live server: POST /new
                              # {"scenario": "e1m1"} switches per episode.
                              # fly_arena: CUSTOM arena derived from
                              # defend_the_line (MIT); weak monster variants +
                              # respawn (stock swarm scenarios unsurvivable
                              # >30s even for a perfect-aim oracle)
  skill: 1                    # doom_skill 1 (halved damage); scenario default is 3
  frame_skip: 4               # game tics per controller step (35 tps / 4 ~= 8.75 steps/s)
  screen_resolution: RES_320X240
  screen_format: RGB24
  max_episode_tics: 3500      # 100s at 35 tps
  max_controller_steps: 900   # 900*4 = 3600 tics cap
  realtime: true              # pace controller so Jev cadence and timeline are real

neural:
  mode: full                  # full (default, real MaleCNS) | reduced | fixture | auto
  timestep_ms: 1.0
  ms_per_game_tic: 24.0       # brain ms simulated per game tic (primary knob).
                              # 8 = legacy (32 steps x 4 tics); 24 = 3x: deep
                              # (central/descending) populations get time to light
                              # up; the game runs ~2-3x slower in wall time.
  steps_per_controller_step: 32   # fallback when ms_per_game_tic is unset
  data_dir: data/raw/malecns-v1.0
  manifest: data/manifests/malecns-v1.0.manifest.json
  cache_full: data/processed/malecns_full_v1
  cache: data/processed/malecns_reduced_v1.npz   # reduced-mode cache (dev only)
  engine:
    syn_gain: 0.3             # synaptic efficacy scale on raw signed synapse counts
    drive_cap_mv: 8.0         # excitatory drive cap (measured: uncapped -> seizure
                              # 52-97% of neurons; cap 8 -> 13-18%)
    tau_v_ms: 20.0
    tau_syn_ms: 5.0
    syn_delay_ms: 2.0
    rate_tau_ms: 100.0
  tonic:                        # calibrated tonic baseline (CHOSEN DYNAMICS, not
    enabled: true               # biology): each population sits near a modest
    target_rate_hz: 2.0         # baseline rate so cascades propagate deep instead
    max_current_mv: 9.0         # of attenuating at rest (threshold gap is 7 mV)
    exclude: [ol_sensory]       # retina stays input-driven (quiet without input)
    population_targets:         # lower targets for motor readouts: tonic alone
      descending_neuron: 0.5    # must not cross decoder thresholds
      vnc_motor: 0.5

vision:
  pathway: photoreceptor      # photoreceptor (full graph) | mosaic (fixture fallback)
  gain: 12.0                  # photoreceptor drive scale (Naka-Rushton)
  half_saturation: 1.0        # post-adaptation contrast scale (adaptation on)
  lamina_bias: 6.0            # tonic current on lamina interneurons (spiking proxy)
  retina_size: [16, 12]       # mosaic fallback only

jev:
  mode: live                  # live (System One API, needs JEV_API_KEY) | mock
  cadence_hz: 3.0             # FAST ticks/sec (reflex questions); game/neural
                              # loop never blocks on Jev
  fast_questions: [ATTACK]    # asked every fast tick (cheap, reflex-level)
  strategy_period_s: 1.5      # full bank incl. strategic INTENT every ~1.5s,
                              # or immediately on salient events (enemy appears,
                              # big damage). Jev = strategy, brain = reflexes;
                              # the last INTENT persists between strategy calls.
  # stale decision semantics: last valid decision stays active until a new one arrives
  action_weighting: true      # Jev probabilities weight/veto the decoder's action
                              # scores per class (attack<-ATTACK, forward<-EXPLORE/
                              # MI.forward, backward<-RETREAT, turns<-REPOSITION/
                              # MI.turns). Chosen architecture, not biology; raw
                              # neural scores are still recorded per step.
  # intent_biases:            # optional override of weighting.INTENT_BIASES —
                              # posture multipliers per INTENT choice, e.g.
                              #   retreat: {backward: 1.6, forward: 0.5}

bridge:
  gain: 10.0
  # Jev question -> upstream/intermediate population. Motor/readout populations
  # (descending_neuron) are rejected by the bridge guard.
  mappings:
    ATTACK: visual_projection
    RETREAT: ol_intrinsic
    EXPLORE: cx_intrinsic
    THREAT_LEVEL: visual_projection
  # choice-question steering: MOVEMENT_INTENT turn_left/right modulate the
  # contralateral PFL3 steering populations (PFL3_L drives DNa02_R and vice
  # versa — real connectome wiring, +380/+356 synapses)
  choice_mappings:
    MOVEMENT_INTENT:
      turn_left: {type: PFL3, side: R}
      turn_right: {type: PFL3, side: L}

motor:
  decoder: typed_dn           # typed_dn (full graph) | population_bank (fallback)
  actions: [forward, backward, turn_left, turn_right, attack, noop]
  # attack readout retargeted 2026-09-22: DNpe017 (the original BCI-style pick)
  # NEVER spiked during encounters (measured: 0.0 Hz with a centered close
  # enemy; its top inputs are VNC interneurons that don't push it over
  # threshold). DNg02_a showed the best measured encounter-vs-quiet contrast
  # among all descending neurons (2.1 vs 1.1 Hz evoked). Data-selected
  # readout, engineering choice.
  readouts:
    turn: {positive: [{type: DNa02, side: R}], negative: [{type: DNa02, side: L}]}
    forward: {positive: [{type: DNp09}, {type: DNg100}], negative: [{type: MDN}]}
    attack: {positive: [{type: DNg02_a}], negative: []}
  turn_gain: 6.0
  forward_gain: 0.3
  attack_gain: 4.0
  turn_min: 0.3
  forward_min: 0.5            # high: forward charge dominated (129 fwd steps in the
                              # 03:00 featured run) and melee convergence kills; the
                              # fly fights from standoff instead
  attack_threshold: 5.0       # Hz on the attack readout channel
  attack_aim_cone_deg: 14.0   # WORKING aim gate: attack fires ONLY when an
  attack_range: 0.45          # enemy is visible, within this cone of screen
                              # center, and within this normalized range —
                              # true ViZDoom label geometry (replaces the old
                              # neural-imbalance gate that starved attack)
  attack_aim_gate: 1.0        # legacy neural fallback gate (used only when the
                              # loop passes no geometry; tests)
  threshold: 0.02             # population_bank fallback only

scenario_profiles:            # per-scenario control overrides, deep-merged over
  fly_arena:                  # the base config for the active scenario; the
    motor:                    # active profile is noted in /state + recordings
      forward_min: 0.5        # current tuned values (see above) — unchanged
  e1m1:
    motor:
      forward_min: 0.2        # lower: no constant forward charge into walls
      attack_range: 0.5
    unstuck:                  # WALL-STUCK reflex: commanding movement while XY
      enabled: true           # barely changes for window_s of game time forces
      window_s: 2.5           # a turn for turn_s (alternating direction).
      epsilon: 6.0            # Engineering reflex, not biology (map units).
      turn_s: 1.0

telemetry:
  population_sample: 32       # neurons sampled per population for summaries
  top_k: 1000                 # most-active neurons recorded per controller step
                              # (activity.top in each step record + /state;
                              # frontend renders top-1000 dimmed; ~12 KB JSON)

plasticity:                     # reward-modulated dopamine plasticity (CHOSEN
  enabled: true                 # DYNAMICS, unvalidated — not biology; doomfly
  learning_rate: 0.05           # v6 reference). Shaped reward events (kill /
  eligibility_tau_s: 1.0        # health delta / death) pulse dopaminergic
  dopamine_tau_s: 1.5           # neurons (PAM for +, PPL1 for -) and gate a
  ref_rate_hz: 20.0             # Hebbian eligibility-trace update on KC->MBON
  baseline_hz: 3.0              # rates below this (tonic spontaneous activity)
                                # build NO eligibility — else tonic makes every
                                # edge eligible and chip damage erases the MB
  negative_gain: 0.25           # depression is 4x weaker than potentiation:
                                # continuous chip damage must not overpower
                                # rare kill events (measured over-depression)
  dan_pulse_mv: 20.0            # synapses only. Weights clamp to
  dan_pulse_steps: 3            # [0, max_weight_multiplier*w0] (runaway guard),
  max_weight_multiplier: 3.0    # persist across episodes, reset on POST /new.
  reward_kill: 1.0              # shaped reward: raw ViZDoom reward is living-
  reward_health_delta: 0.02     # reward only, so events come from observation
  reward_death: -1.0            # deltas (damage dealt not directly observable;
                                # kill is its proxy)
  reward_attack_aimed: 0.3      # BEHAVIOR SHAPING (chosen, owner-directed):
  penalty_attack_blind: -0.1    # + attack with enemy truly in the reticle;
  penalty_stuck: -0.05          # - blind firing; - wall-stuck time (parked
  reward_escape: 0.2            # while commanding movement); + escape after an
                                # unstuck-reflex trigger confirmed by movement
  checkpoint: outputs/learning/checkpoint.npz   # one continuously-learning fly:
  checkpoint_interval_s: 60     # weights persist across POST /new + restarts
                                # (graph+config provenance-checked); POST /new
                                # {reset_learning:true} restarts the fly fresh

recording:
  directory: outputs/recordings
  record_frames: true         # JPEG frames for browser replay
  jpeg_quality: 80
  episodes: 3                 # run N episodes; best (survival, then kills) is featured

api:
  host: 127.0.0.1
  port: 8420

live:                           # live mode server (python -m flydoom.api.live, make live)
  fps: 6                        # HTTP frame publish cap (sim runs every controller step)
  frame_size: [640, 480]        # W x H of the data-url JPEG in GET /state
  jpeg_quality: 75
